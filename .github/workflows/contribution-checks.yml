name: Contribution checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Validate required PR sections
        run: python3 .github/scripts/check_contributions.py body

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Validate every PR commit subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_contributions.py commits
