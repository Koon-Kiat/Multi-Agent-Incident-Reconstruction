[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mair-incident-reconstruction"
version = "0.2.0"
description = "Local security event processing and evidence-based authentication investigation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "python-evtx>=0.8.1,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mair-authentication = "authentication_agent.__main__:main"
mair-events = "event_processing.__main__:main"
mair-investigate-authentication = "authentication_agent.investigate_corpus:main"

[tool.setuptools.packages.find]
include = ["authentication_agent*", "event_processing*"]
exclude = ["authentication_agent.tests*", "event_processing.tests*"]

[tool.setuptools.package-data]
authentication_agent = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["authentication_agent/tests", "event_processing/tests", "tests"]
markers = ["ollama: optional test requiring explicitly configured local Ollama"]
